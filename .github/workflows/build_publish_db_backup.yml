name: Build and publish db-backup image

on:
  push:
    branches:
      - v7
    paths:
      - 'examples/smartoys/percona/db-backup/**'
      - '.github/workflows/build_publish_db_backup.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smartoys/mautic-stack-db-backup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: examples/smartoys/percona/db-backup
          file: examples/smartoys/percona/db-backup/Dockerfile
          platforms: linux/amd64
          push: true
          # sbom/provenance false — older Portainer/Docker can't pull OCI indexes,
          # see memory project-ghcr-oci-index-compatibility
          sbom: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}

x-mautic-volumes:
  &mautic-volumes
  # At the root of the host mounts for Mautic data persistence
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/config:/var/www/html/config:z
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/logs:/var/www/html/var/logs:z
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/media/files:/var/www/html/docroot/media/files:z
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/media/images:/var/www/html/docroot/media/images:z
  - /portainer/${COMPOSE_PROJECT_NAME}-cron:/opt/mautic/cron:z
services:
  # Database moved to separate stack - see percona/docker-compose.percona.yml
  # Start with: cd percona && docker-compose -f docker-compose.percona.yml up -d

  smtprelay:
    image: mwader/postfix-relay
    hostname: mauticsmtp
    environment:
      - POSTFIX_myhostname=mailing.dlgamer.com
      - OPENDKIM_DOMAINS=dlgamer.com
      - POSTFIX_inet_protocols=ipv4       
    volumes:
      - /portainer/${COMPOSE_PROJECT_NAME}-postfix/opendkim_keys:/etc/opendkim/keys:ro
    networks:
      - default
    restart: unless-stopped  

  mautic_web:
    image: mautic/mautic:7.1.1-apache
    volumes: *mautic-volumes
    env_file:
      - .mautic_env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: mailing.dlgamer.com' http://localhost/ -o /dev/null"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default
      - web
      - mautic-db-network
    restart: unless-stopped  
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # HTTPS Router
      - "traefik.http.routers.mautic-https.rule=Host(`mailing.dlgamer.com`)"
      - "traefik.http.routers.mautic-https.entrypoints=https"
      - "traefik.http.routers.mautic-https.tls=true"
      - "traefik.http.routers.mautic-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.mautic-https.middlewares=secure-headers"

      # Security Headers Middleware
      - "traefik.http.middlewares.secure-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stspreload=true"
      - "traefik.http.middlewares.secure-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.forcestsheader=true"
      - "traefik.http.middlewares.secure-headers.headers.framedeny=true"
      - "traefik.http.middlewares.secure-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.secure-headers.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.secure-headers.headers.permissionspolicy=camera=(), microphone=(), geolocation=()"

      # Service - specify the port
      - "traefik.http.services.mautic.loadbalancer.server.port=80"
      
      # Connect to the web network
      - "traefik.docker.network=web"

  mautic_cron:
    image: mautic/mautic:7.1.1-apache
    volumes: *mautic-volumes
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_cron    
    env_file:
      - .mautic_env
    depends_on:
      mautic_web:
        condition: service_healthy
    networks:
      - default
      - mautic-db-network
    restart: unless-stopped  
    external_links:
      - percona-db:mysql

  mautic_worker:
    image: mautic/mautic:7.1.1-apache
    volumes: *mautic-volumes
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_worker    
    env_file:
      - .mautic_env
    depends_on:
      mautic_web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'messenger:consume' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    networks:
      - default
      - mautic-db-network
    restart: unless-stopped  
    external_links:
      - percona-db:mysql

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-docker
  web:
    external: true
  mautic-db-network:
    external: true
    name: mautic-db-network
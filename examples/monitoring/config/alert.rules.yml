groups:
  - name: dragonfly
    interval: 30s
    rules:
      - alert: DragonflyMemoryHigh
        expr: (redis_memory_used_bytes{instance="dragonfly"} / redis_memory_max_bytes{instance="dragonfly"}) > 0.8
        for: 5m
        labels:
          severity: warning
          stack: dragonfly
        annotations:
          summary: "Dragonfly memory > 80% of cap"
          description: "Dragonfly is using {{ $value | humanizePercentage }} of its maxmemory cap. Raise the cap or audit TTLs."

      - alert: DragonflyDown
        expr: up{job="dragonfly"} == 0
        for: 2m
        labels:
          severity: critical
          stack: dragonfly
        annotations:
          summary: "Dragonfly exporter unreachable"
          description: "Prometheus has been unable to scrape dragonfly-exporter for 2 minutes."

      - alert: DragonflyEvictionRateSustained
        expr: rate(redis_evicted_keys_total{instance="dragonfly"}[5m]) > 10
        for: 15m
        labels:
          severity: info
          stack: dragonfly
        annotations:
          summary: "Dragonfly evicting > 10 keys/sec sustained"
          description: "Eviction is working (cache_mode=true), but sustained eviction rate of {{ $value }} keys/sec for 15m suggests the working set exceeds maxmemory. Consider raising the cap."

  - name: dragonfly-queue
    interval: 30s
    rules:
      # The queue instance runs noeviction: hitting maxmemory returns OOM on
      # write, so queued jobs / Horizon meta fail to enqueue (not evicted).
      # That makes high memory here more serious than on the evicting cache.
      - alert: DragonflyQueueMemoryHigh
        expr: (redis_memory_used_bytes{instance="dragonfly-queue"} / redis_memory_max_bytes{instance="dragonfly-queue"}) > 0.8
        for: 5m
        labels:
          severity: warning
          stack: dragonfly-queue
        annotations:
          summary: "Dragonfly queue memory > 80% of cap"
          description: "dragonfly-queue is at {{ $value | humanizePercentage }} of its maxmemory cap. It is noeviction, so approaching the cap risks OOM-on-write (jobs/Horizon meta fail to enqueue). Raise --maxmemory or investigate a job/failed-job backlog."

      - alert: DragonflyQueueMemoryCritical
        expr: (redis_memory_used_bytes{instance="dragonfly-queue"} / redis_memory_max_bytes{instance="dragonfly-queue"}) > 0.95
        for: 2m
        labels:
          severity: critical
          stack: dragonfly-queue
        annotations:
          summary: "Dragonfly queue memory > 95% of cap — OOM imminent"
          description: "dragonfly-queue is at {{ $value | humanizePercentage }} of its maxmemory cap. Writes will start failing with OOM, blocking job enqueue. Raise --maxmemory now and/or drain the backlog."

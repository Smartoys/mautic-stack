global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: dragonfly
    static_configs:
      - targets: ['dragonfly-exporter:9121']
        labels:
          instance: dragonfly
      # Queue instance (dragonfly-queue stack). Reachable on redis-net by
      # hostname. Same job so DragonflyDown covers it; instance label lets the
      # memory rules treat cache (evicting) and queue (noeviction) differently.
      - targets: ['dragonfly-queue-exporter:9121']
        labels:
          instance: dragonfly-queue

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert.rules.yml

route:
  receiver: ops-email
  group_by: [alertname, stack]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: ops-email
    email_configs:
      - to: david@kemushi.eu
        from: alerts@smartoys.be
        smarthost: smtprelay:25
        require_tls: false
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, stack]

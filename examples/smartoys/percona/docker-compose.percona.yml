version: '3.8'

services:
  reports-perms:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    volumes:
      - mautic-db-reports:/reports
    command: >
      sh -lc "mkdir -p /reports &&
              chown -R 1001:1001 /reports &&
              chmod -R u+rwX,g+rwX /reports"
  mysql-logs-perms:
    image: alpine:3.20
    container_name: mysql-logs-perms
    user: "0:0"
    restart: "no"
    volumes:
      - mautic-db-logs:/var/log/mysql
    command: >
      sh -lc "mkdir -p /var/log/mysql &&
              chown -R 1001:1001 /var/log/mysql &&
              chmod 775 /var/log/mysql"
  percona-db:
    image: percona/percona-server:8.4
    container_name: percona-db
    restart: unless-stopped
    depends_on:
      mysql-logs-perms:
        condition: service_completed_successfully    
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mautic-db-data:/var/lib/mysql
      - mautic-db-logs:/var/log/mysql
    ports:
      - "3306:3306"
    command:
      - --mysql-native-password=ON
      - --skip-log-bin
      - --slow_query_log=1
      - --slow_query_log_file=/var/log/mysql/mysql-slow.log
      - --long_query_time=1
      - --log_queries_not_using_indexes=1
      - --log_slow_admin_statements=1
      - --log_slow_slave_statements=1
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --max_connections=200
      - --innodb_buffer_pool_size=1G
      - "--optimizer-switch=prefer_ordering_index=off,favor_range_scan=on"
      - --max_allowed_packet=256M
      - --net_read_timeout=600
      - --net_write_timeout=600
      - --innodb_log_file_size=512M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_flush_method=O_DIRECT
      - --innodb_io_capacity=2000
      - --innodb_io_capacity_max=4000      
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mautic-db-network

  percona-toolkit:
    image: perconalab/percona-toolkit:latest
    container_name: percona-toolkit
    restart: unless-stopped
    volumes:
      - mautic-db-logs:/var/log/mysql:ro
      - mautic-db-scripts:/opt/analysis:ro
      - mautic-db-reports:/reports
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command: tail -f /dev/null
    networks:
      - mautic-db-network
    depends_on:
      reports-perms:
        condition: service_completed_successfully
      percona-db:
        condition: service_healthy

  # ===== Percona Monitoring and Management (PMM) =====
  # Web UI exposed directly on the host: https://<host-ip>:8443
  # PMM ships a self-signed cert — accept the browser warning on first visit.
  # Internal-only access; no Traefik / external routing.
  pmm-server:
    image: percona/pmm-server:3
    container_name: pmm-server
    hostname: pmm-server
    restart: unless-stopped
    environment:
      # Initial admin password — PMM 3 forces password change on first login
      # unless this is set explicitly. Note: only applied on first init of /srv.
      - PMM_ADMIN_PASSWORD=${PMM_ADMIN_PASSWORD}
    volumes:
      - /portainer/pmm-server-data:/srv:z
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-fksS", "https://localhost:8443/v1/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - mautic-db-network

  pmm-client:
    image: percona/pmm-client:3
    container_name: pmm-client
    hostname: pmm-client
    restart: unless-stopped
    depends_on:
      pmm-server:
        condition: service_healthy
      percona-db:
        condition: service_healthy
    environment:
      - PMM_AGENT_SERVER_ADDRESS=pmm-server:8443
      - PMM_AGENT_SERVER_USERNAME=admin
      - PMM_AGENT_SERVER_PASSWORD=${PMM_ADMIN_PASSWORD}
      - PMM_AGENT_SERVER_INSECURE_TLS=1
      - PMM_AGENT_SETUP=1
      - PMM_AGENT_SETUP_FORCE=1
      - PMM_AGENT_CONFIG_FILE=config/pmm-agent.yaml
    volumes:
      - /portainer/pmm-client-data:/srv:z
    networks:
      - mautic-db-network

volumes:
  mautic-db-data:
    external: true
  mautic-db-logs:
    external: true
  mautic-db-scripts:
    external: true
  mautic-db-reports:
    external: true

networks:
  mautic-db-network:
    external: true
    name: ${NETWORK_NAME:-mautic-db-network}

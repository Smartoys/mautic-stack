x-mautic-volumes:
  &mautic-volumes
  # At the root of the host mounts for Mautic data persistence
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/config:/var/www/html/config:z
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/logs:/var/www/html/var/logs:z
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/media/files:/var/www/html/docroot/media/files:z
  - /portainer/${COMPOSE_PROJECT_NAME}-mautic/media/images:/var/www/html/docroot/media/images:z
  - /portainer/${COMPOSE_PROJECT_NAME}-cron:/opt/mautic/cron:z
services:
  # Database moved to separate stack - see percona/docker-compose.percona.yml
  # Start with: cd percona && docker-compose -f docker-compose.percona.yml up -d

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
    volumes:
      - /portainer/${COMPOSE_PROJECT_NAME}-rabbitmq:/var/lib/rabbitmq:z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default
    restart: unless-stopped

  smtprelay:
    image: mwader/postfix-relay
    hostname: mauticsmtp
    environment:
      - POSTFIX_myhostname=mailing.smartoys.be
      - OPENDKIM_DOMAINS=smartoys.be gamecash.be gamecash.fr
      - POSTFIX_inet_protocols=ipv4
      # Force every outbound envelope sender to a single bounce mailbox
      # so all DSNs land in mailing@smartoys.be (monitored by Mautic).
      # envelope_sender keeps the visible From: header untouched.
      - POSTFIX_sender_canonical_maps=regexp:/etc/postfix/sender_canonical
      - POSTFIX_sender_canonical_classes=envelope_sender
    volumes:
      - /portainer/${COMPOSE_PROJECT_NAME}-postfix/opendkim_keys:/etc/opendkim/keys:ro
      - /portainer/${COMPOSE_PROJECT_NAME}-postfix/sender_canonical:/etc/postfix/sender_canonical:ro
    networks:
      - default
    restart: unless-stopped

  mautic_web:
    # Custom Mautic image built from https://github.com/Smartoys/mautic-stack
    # Images are private and require GHCR authentication
    # To authenticate: echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
    # ghcr.io/smartoys/mautic-stack:7.0.1-apache
    image: ghcr.io/smartoys/mautic-stack:7.1.1-apache
    volumes: *mautic-volumes
    env_file:
      - .mautic_env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: mailing.smartoys.be' http://localhost/ -o /dev/null"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - web
      - mautic-db-network
    restart: unless-stopped
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # HTTPS Router
      - "traefik.http.routers.mautic-smartoys-https.rule=Host(`mailing.smartoys.be`)"
      - "traefik.http.routers.mautic-smartoys-https.entrypoints=https"
      - "traefik.http.routers.mautic-smartoys-https.tls=true"
      - "traefik.http.routers.mautic-smartoys-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.mautic-smartoys-https.middlewares=mautic-smartoys-secure-headers"
      - "traefik.http.routers.mautic-smartoys-https.service=mautic-smartoys"

      # Security Headers Middleware
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.stspreload=true"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.forcestsheader=true"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.framedeny=true"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.contenttypenosniff=true"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.referrerpolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.mautic-smartoys-secure-headers.headers.permissionspolicy=camera=(), microphone=(), geolocation=()"

      # Service - specify the port
      - "traefik.http.services.mautic-smartoys.loadbalancer.server.port=80"
      
      # Connect to the web network
      - "traefik.docker.network=web"

  mautic_cron:
    # Custom Mautic image built from https://github.com/Smartoys/mautic-stack
    # Images are private and require GHCR authentication
    # To authenticate: echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
    image: ghcr.io/smartoys/mautic-stack:7.1.1-apache
    volumes: *mautic-volumes
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_cron
    env_file:
      - .mautic_env
    depends_on:
      mautic_web:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - mautic-db-network
    restart: unless-stopped
    external_links:
      - percona-db:mysql

  mautic_worker:
    # Custom Mautic image built from https://github.com/Smartoys/mautic-stack
    # Images are private and require GHCR authentication
    # To authenticate: echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
    image: ghcr.io/smartoys/mautic-stack:7.1.1-apache
    volumes: *mautic-volumes
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_worker
    env_file:
      - .mautic_env
    depends_on:
      mautic_web:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'messenger:consume' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    networks:
      - default
      - mautic-db-network
    restart: unless-stopped  
    external_links:
      - percona-db:mysql

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-docker
  web:
    external: true
  mautic-db-network:
    external: true
    name: mautic-db-network